name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
        env:
          GITHUB_ACTIONS: 'true'

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node20-linux-x64
            bin: backup-verify-linux-x64
          - os: ubuntu-latest
            target: node20-linux-arm64
            bin: backup-verify-linux-arm64
          - os: macos-latest
            target: node20-darwin-arm64
            bin: backup-verify-darwin-arm64
          - os: windows-latest
            target: node20-win32-x64
            bin: backup-verify-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/build.js ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          path: dist/${{ matrix.bin }}*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
